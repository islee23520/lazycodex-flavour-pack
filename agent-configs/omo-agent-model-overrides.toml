[source]
agents_dir = "${CODEX_HOME}/agents"

# LFP targets only agents upstream OMO dispatches. Legacy LFP-owned agents
# (oracle/prometheus/hephaestus/atlas/sisyphus-junior) are absent by design —
# re-adding them recreates orphan overrides. Provider load is spread across
# gpt/glm/gemini/grok so no single gateway hits concentrated xhigh 429s.

[agents.default]
model = "gpt-5.5"
model_reasoning_effort = "medium"
service_tier = "default"

[agents.ulw]
model = "gpt-5.5"
model_reasoning_effort = "xhigh"
service_tier = "default"

[agents.explorer]
model = "xai/grok-code-fast-1"

[agents.librarian]
model = "xai/grok-code-fast-1"

[agents.metis]
model = "gpt-5.5"
model_reasoning_effort = "high"
service_tier = "default"

[agents.momus]
model = "gpt-5.5"
model_reasoning_effort = "xhigh"
service_tier = "default"

[agents.plan]
model = "gpt-5.5"
model_reasoning_effort = "xhigh"
service_tier = "default"

[agents.lazycodex-executor]
model = "gpt-5.5"
model_reasoning_effort = "high"
service_tier = "default"

# Reviewer chain is cross-provider: code-reviewer GLM cross-checks GPT-authored
# code; qa/gate on GPT to avoid piling xhigh load on the GLM gateway.
[agents.lazycodex-code-reviewer]
model = "zai/glm-5.2[1m]"

[agents.lazycodex-qa-executor]
model = "gpt-5.5"
model_reasoning_effort = "medium"
service_tier = "default"

[agents.lazycodex-gate-reviewer]
model = "gpt-5.5"
model_reasoning_effort = "high"
service_tier = "default"

[agents.lazycodex-clone-fidelity-reviewer]
model = "google-antigravity/gemini-3.1-pro-preview"
