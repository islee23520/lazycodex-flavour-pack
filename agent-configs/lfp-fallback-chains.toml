# LFP Declarative Fallback Chains
# Per-agent and per-category ordered fallback model arrays.
# Consumed by src/model/model-fallback-resolver.ts.
#
# Only existing OMO/LazyCodex agents have per-agent chains. Legacy LFP-owned
# agents (oracle/prometheus/hephaestus/atlas/sisyphus-junior) are intentionally
# absent — they are not dispatched upstream.

[categories.visual-engineering]
chain = ["glm-5", "gpt-5.5"]

[categories.ultrabrain]
chain = ["gemini-3.1-pro", "glm-5.1"]

[categories.deep]
chain = ["gpt-5.5", "gemini-3.1-pro"]

[categories.artistry]
chain = ["gpt-5.5", "glm-5"]

[categories.quick]
chain = ["gpt-5.4-mini", "gpt-5.5"]

[categories.unspecified-low]
chain = ["gpt-5.5", "glm-5"]

[categories.unspecified-high]
chain = ["gpt-5.5", "gemini-3.1-pro"]

[categories.writing]
chain = ["gpt-5.5", "glm-5"]
