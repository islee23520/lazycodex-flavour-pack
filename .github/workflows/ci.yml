name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Isolated smoke test
        run: npm run smoke:isolated

      - name: Integration tests
        run: node scripts/ci-integration-test.mjs

      - name: Pack check
        run: npm run pack:check

      - name: Verify no MCP surface
        run: |
          ! grep -r "mcpServers\|mcp_servers\|\.mcp\.json" src/ --include="*.ts" | grep -v "test\|TODO\|FIXME"
          echo "OK: no MCP surface in source"